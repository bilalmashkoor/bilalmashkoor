<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="58" viewBox="0 0 820 58" role="img" aria-labelledby="title desc">
  <title id="title">What Bilal is currently building</title>
  <desc id="desc">A rotating status line about the Tenxora platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1c31"/>
      <stop offset="100%" stop-color="#07111f"/>
    </linearGradient>
  </defs>
  <rect width="820" height="58" rx="10" fill="url(#bg)" stroke="#263d5a"/>
  <text x="22" y="36" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.5">NOW</text>
  <text x="82" y="36" fill="#d9e7f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    building the Tenxora platform kernel
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.28;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text x="82" y="36" fill="#d9e7f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    making operations easier to understand, change and scale
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.30;0.48;0.54;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text x="82" y="36" fill="#d9e7f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    connecting people, processes, systems and AI
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.56;0.73;0.79;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text x="82" y="36" fill="#d9e7f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    shipping small improvements that compound
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.79;0.81;0.96;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <rect x="786" y="20" width="8" height="18" rx="1" fill="#5eead4">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
